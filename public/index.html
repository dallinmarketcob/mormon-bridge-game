<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Mormon Bridge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='4' width='44' height='56' rx='7' fill='%23f2f2f3'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' fill='%23111'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Libre+Baskerville:wght@700&family=Orbitron:wght@700&family=IM+Fell+English+SC&family=Bangers&display=swap">
<style>
/* Layout: one phone-width column on a black table: header, status, players, table, your hand. */
:root {
  --bg: #0a0a0b;
  --panel: #141416;
  --panel-2: #1c1c20;
  --line: #2a2a30;
  --ink: #f2f2f3;
  --ink-soft: #9a9aa4;
  --accent: #e8c066;
  --accent-ink: #1a1408;
  --good: #6fdc8c;
  --bad: #ff7a6b;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-title: "Libre Baskerville", Georgia, serif;

  /* Card style tokens. "Classic" by default; each [data-deck] below swaps them. */
  --c-bg: #ffffff;
  --c-face: none;
  --c-edge: #d4d4d8;
  --c-black: #151515;
  --c-red: #c8102e;
  --c-font: "Libre Baskerville", Georgia, serif;
  --c-weight: 700;
  --c-ix: 17px;
  --c-pip: 26px;
  --c-glow: none;
  --c-back: repeating-linear-gradient(45deg, #1f3a8a 0 5px, #2848a8 5px 10px);
  --c-back-edge: #152a66;
  color-scheme: dark;
}
[data-deck="casino"] {
  --c-bg: #111111; --c-edge: #c9a24a; --c-black: #e7c46b; --c-red: #ff4d5a;
  --c-back: repeating-linear-gradient(45deg, #0e0e0e 0 6px, #2a2210 6px 7px), #0e0e0e; --c-back-edge: #c9a24a;
}
[data-deck="neon"] {
  --c-bg: #0b0b16; --c-edge: #3cf0ff; --c-black: #3cf0ff; --c-red: #ff3fa4;
  --c-font: "Orbitron", "Figtree", sans-serif; --c-ix: 15px; --c-pip: 24px;
  --c-glow: 0 0 6px currentColor, 0 0 14px currentColor;
  --c-back: linear-gradient(#ff3fa4 1px, transparent 1px) 0 0/10px 10px, linear-gradient(90deg, #3cf0ff 1px, transparent 1px) 0 0/10px 10px, #0b0b16;
  --c-back-edge: #ff3fa4;
}
[data-deck="vintage"] {
  --c-bg: #ecdfc0; --c-face: radial-gradient(circle at 80% 85%, rgba(120,80,30,.18), transparent 45%), radial-gradient(circle at 15% 10%, rgba(120,80,30,.12), transparent 40%);
  --c-edge: #b39d70; --c-black: #3a2c1e; --c-red: #8d2a1c;
  --c-font: "IM Fell English SC", Georgia, serif; --c-weight: 400; --c-ix: 19px; --c-pip: 27px;
  --c-back: repeating-linear-gradient(0deg, #6b4a2b 0 3px, #7d5a37 3px 6px); --c-back-edge: #4a321c;
}
[data-deck="bigprint"] {
  --c-bg: #ffffff; --c-edge: #bdbdbd; --c-black: #000000; --c-red: #d00000;
  --c-font: "Figtree", system-ui, sans-serif; --c-weight: 800; --c-ix: 26px; --c-pip: 30px;
  --c-back: #2563eb; --c-back-edge: #1d4ed8;
}
[data-deck="web"] {
  --c-bg: #ffffff; --c-edge: #1d4ed8; --c-black: #1d4ed8; --c-red: #d7263d;
  --c-font: "Bangers", "Figtree", sans-serif; --c-weight: 400; --c-ix: 21px; --c-pip: 26px;
  /* --c-face and --c-back are filled in by script with drawn spiderwebs */
  --c-back: #d7263d; --c-back-edge: #8f1324;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 560px;
  margin: 0 auto;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-title); font-size: 24px; white-space: nowrap; }
header.top > .row { flex-wrap: nowrap; gap: 6px !important; }
@media (max-width: 420px) {
  h1 { font-size: 17px; }
  header.top .btn.small { padding: 6px 8px; }
  header.top .chip { letter-spacing: .06em; padding: 4px 8px; }
}
h2 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-soft); font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  padding: 10px 14px; border-radius: 10px; font-weight: 600; min-height: 44px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btn.on { outline: 2px solid var(--accent); outline-offset: -2px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.block { width: 100%; }
input[type=text], select {
  font: inherit; color: var(--ink); background: #0f0f11; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%;
}
input.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 700; text-align: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 700; letter-spacing: .14em; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.dot.off { background: var(--ink-soft); opacity: .5; }
.dot.warn { background: var(--bad); }

.status { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.status .big { font-size: 18px; font-weight: 700; }
.trumpbox { display: flex; align-items: center; gap: 8px; }

.players { display: flex; flex-direction: column; gap: 6px; }
.prow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center;
  padding: 9px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.prow.turn { border-color: var(--accent); background: #1d1a12; }
.prow .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.prow .mid { font-size: 13px; color: var(--ink-soft); text-align: right; display: flex; align-items: center; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.prow .mid b { color: var(--ink); }
.prow .score { font-weight: 700; min-width: 40px; text-align: right; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 6px; background: var(--panel-2); color: var(--ink-soft); flex: none; }
.tag.dealer { background: var(--accent); color: var(--accent-ink); }
.made { color: var(--good); } .missed { color: var(--bad); }
.count { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- cards ---------- */
.card {
  position: relative; width: 58px; height: 84px; border-radius: 8px; flex: none;
  background: var(--c-face), var(--c-bg); border: 1px solid var(--c-edge); color: var(--c-black);
  box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.35);
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
  padding: 5px 6px; font-family: var(--c-font); font-weight: var(--c-weight);
  transition: transform .12s ease; overflow: hidden;
}
.card.red { color: var(--c-red); }
.card .ix, .card .pip { text-shadow: var(--c-glow); line-height: 1; }
.card .ix { font-size: var(--c-ix); }
.card .pip { font-size: var(--c-pip); align-self: flex-end; }
[data-deck="bigprint"] .card { align-items: center; justify-content: center; gap: 2px; }
[data-deck="bigprint"] .card .pip { align-self: center; }
.card.sm { width: 44px; height: 62px; padding: 3px 4px; }
.card.sm .ix { font-size: calc(var(--c-ix) * .78); }
.card.sm .pip { font-size: calc(var(--c-pip) * .74); }
.card.back { background: var(--c-back); border-color: var(--c-back-edge); }
.card.tiny { width: 14px; height: 20px; border-radius: 3px; padding: 0; box-shadow: none; }
button.card.illegal { opacity: .35; filter: saturate(.3); cursor: not-allowed; }
button.card.sel { transform: translateY(-12px); outline: 2px solid var(--accent); outline-offset: 1px; }
.hand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 14px; }

.table { min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.trick { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.play { display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 72px; }
.play .who { font-size: 12px; color: var(--ink-soft); max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.play.win .card { outline: 2px solid var(--accent); outline-offset: 2px; }
.play.win .who { color: var(--accent); font-weight: 700; }
.note { text-align: center; }

.bids { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
.bids .btn { font-size: 18px; font-variant-numeric: tabular-nums; }

details summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
.tablewrap { overflow-x: auto; margin-top: 8px; }
table.hist { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; width: 100%; }
table.hist th, table.hist td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
table.hist th:first-child, table.hist td:first-child { text-align: left; }
table.hist tfoot td { font-weight: 700; border-bottom: 0; }

/* card style picker */
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.deckopt { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; text-align: left; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); }
.deckopt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.deckopt .cards { display: flex; gap: 6px; }
.deckopt .nm { font-weight: 700; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100vw - 32px), 480px); background: #1c1c20; color: var(--ink); border: 1px solid var(--bad);
  padding: 12px 14px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 20;
}
.banner { padding: 10px 12px; border-radius: 10px; background: #1d1a12; border: 1px solid var(--accent); }
.confirm { border-color: var(--bad); }
.rules { margin: 0; padding-left: 18px; }
.rules li { margin-bottom: 4px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body data-deck="classic">
<div id="app"><p class="muted">Shuffling the deck…</p></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
// ---------- small rules helpers (the server is the referee; these just drive the UI) ----------
const SUIT_SYM = { S: '♠', H: '♥', D: '♦', C: '♣' };
const SUIT_NAME = { S: 'Spades', H: 'Hearts', D: 'Diamonds', C: 'Clubs' };
const suitOf = c => c[0];
const rankOf = c => parseInt(c.slice(1), 10);
const rankLabel = r => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' }[r] || String(r));
function legalCards(hand, trick, trump = null, trumpBroken = true) {
  if (!trick.length) {
    if (trump && !trumpBroken) {
      const nonTrump = hand.filter(c => suitOf(c) !== trump);
      if (nonTrump.length) return nonTrump;
    }
    return hand.slice();
  }
  const led = suitOf(trick[0].c);
  const f = hand.filter(c => suitOf(c) === led);
  return f.length ? f : hand.slice();
}
function sortHand(hand, trump) {
  const order = ['S', 'H', 'C', 'D'];
  return hand.slice().sort((a, b) => {
    const sa = suitOf(a), sb = suitOf(b);
    if (sa !== sb) {
      if (sa === trump) return -1;
      if (sb === trump) return 1;
      return order.indexOf(sa) - order.indexOf(sb);
    }
    return rankOf(b) - rankOf(a);
  });
}
function resolveMaxCards(setting, n) {
  const withTrump = Math.max(1, Math.floor(51 / n));
  if (setting === 'auto' || setting == null) return Math.min(7, withTrump);
  return Math.max(1, Math.min(Math.floor(52 / n), parseInt(setting, 10) || 1));
}

// ---------- card styles ----------
const DECKS = [
  { id: 'classic', name: 'Classic', desc: 'Crisp white, red and black' },
  { id: 'casino', name: 'Casino', desc: 'Black and gold' },
  { id: 'neon', name: 'Neon', desc: 'Glowing pink and blue' },
  { id: 'vintage', name: 'Vintage', desc: 'Old paper, saloon print' },
  { id: 'bigprint', name: 'Big Print', desc: 'Huge, easy-to-read numbers' },
  { id: 'web', name: 'Web Slinger', desc: 'Red and blue, spiderwebs' },
];
// Draw a spiderweb as SVG (spokes plus sagging rings) for the Web Slinger deck.
function webSVG(cx, cy, r, stroke, opacity, w, h) {
  const spokes = 10, rings = 5; let d = '';
  const pts = k => Array.from({ length: spokes + 1 }, (_, i) => {
    const a = (i / spokes) * Math.PI * 2; return [cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k];
  });
  pts(1).forEach(([x, y]) => { d += `M${cx} ${cy}L${x.toFixed(1)} ${y.toFixed(1)}`; });
  for (let j = 1; j <= rings; j++) {
    const p = pts(j / rings);
    for (let i = 0; i < spokes; i++) {
      const [x1, y1] = p[i], [x2, y2] = p[i + 1];
      const mx = (x1 + x2) / 2 + (cx - (x1 + x2) / 2) * .12, my = (y1 + y2) / 2 + (cy - (y1 + y2) / 2) * .12;
      d += `M${x1.toFixed(1)} ${y1.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${stroke}" stroke-opacity="${opacity}" stroke-width="1"/></svg>`;
}
function spiderSVG(color) {
  const legs = [[-1, -1], [-1, -.35], [-1, .35], [-1, 1]].map(([sx, sy]) =>
    `M${50 + sx * 6} ${52 + sy * 6}Q${50 + sx * 22} ${44 + sy * 18} ${50 + sx * 30} ${56 + sy * 26}` +
    `M${50 - sx * 6} ${52 + sy * 6}Q${50 - sx * 22} ${44 + sy * 18} ${50 - sx * 30} ${56 + sy * 26}`).join('');
  return `<g fill="${color}" stroke="${color}"><path d="${legs}" fill="none" stroke-width="3" stroke-linecap="round"/><ellipse cx="50" cy="44" rx="7" ry="8"/><ellipse cx="50" cy="60" rx="10" ry="13"/></g>`;
}
(function paintWebDeck() {
  const url = s => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
  const face = webSVG(58, 84, 46, '#1d4ed8', .22, 58, 84);
  const back = webSVG(50, 50, 72, '#ffffff', .55, 100, 140).replace('</svg>', spiderSVG('#111827').replace('<g ', '<g transform="translate(0 20)" ') + '</svg>');
  const root = document.documentElement.style;
  const rule = document.createElement('style');
  rule.textContent = `[data-deck="web"]{--c-face:${url(face)} right bottom/100% 100% no-repeat;--c-back:${url(back)} center/cover no-repeat, #d7263d;}`;
  document.head.appendChild(rule);
})();

// ---------- local memory (per phone) ----------
const LS = {
  get(k) { try { return localStorage.getItem('mb_' + k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('mb_' + k) : localStorage.setItem('mb_' + k, v); } catch {} },
};
let token = LS.get('token');
if (!token) { token = (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('')); LS.set('token', token); }
let deck = LS.get('deck') || 'classic';
if (!DECKS.some(d => d.id === deck)) deck = 'classic';
document.body.dataset.deck = deck;

// ---------- connection ----------
let code = LS.get('code');
let view = null;          // what the server lets this phone see
let conn = 'idle';        // idle | connecting | open | retrying
let ws = null, retry = 0, retryTimer = null, pendingJoin = null;
let selected = null, confirming = null, showDecks = false, busy = false;
const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  $toast.textContent = msg; $toast.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $toast.hidden = true; }, 4500);
}

function connect() {
  if (!code) return;
  clearTimeout(retryTimer);
  if (ws) { ws.onclose = null; try { ws.close(); } catch {} }
  conn = retry ? 'retrying' : 'connecting';
  render();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const sock = new WebSocket(`${proto}://${location.host}/ws/${code}?t=${encodeURIComponent(token)}`);
  ws = sock;
  sock.onopen = () => {
    retry = 0; conn = 'open';
    if (pendingJoin) { send({ type: 'join', name: pendingJoin }); pendingJoin = null; }
    render();
  };
  sock.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'state') {
      const before = view ? `${view.status}|${view.roundIdx}|${(view.trick || []).length}|${view.turn}` : '';
      view = m.view;
      const after = `${view.status}|${view.roundIdx}|${(view.trick || []).length}|${view.turn}`;
      if (before !== after) selected = null;
      busy = false;
      render();
    } else if (m.type === 'error') {
      busy = false;
      if (m.code === 'not_found') { toast(`No game found with code ${code}. Check the code with the host.`); leaveGame(); return; }
      toast(m.message); render();
    }
  };
  sock.onclose = ev => {
    if (sock !== ws) return;
    if (ev.code === 4404) return;
    conn = 'retrying'; render();
    const wait = Math.min(8000, 800 * 2 ** retry++);
    retryTimer = setTimeout(connect, wait);
  };
}
function send(msg) {
  if (!ws || ws.readyState !== 1) { toast('Not connected yet. Hang on a second and try again.'); return false; }
  ws.send(JSON.stringify(msg)); return true;
}
function openGame(c, joinName) {
  code = c; LS.set('code', c); view = null; retry = 0; pendingJoin = joinName || null;
  if (location.hash !== '#' + c) history.replaceState(null, '', '#' + c);
  connect();
}
function leaveGame() {
  clearTimeout(retryTimer);
  if (ws) { ws.onclose = null; try { ws.close(); } catch {} }
  ws = null; code = null; view = null; conn = 'idle'; confirming = null;
  LS.set('code', null);
  history.replaceState(null, '', location.pathname);
  render();
}

function readName() {
  const v = (document.getElementById('name')?.value || '').trim().slice(0, 16);
  if (!v) { toast('Type your name first so everyone knows who you are.'); return null; }
  LS.set('name', v); return v;
}
async function createGame() {
  const name = readName(); if (!name || busy) return;
  busy = true; render();
  try {
    const r = await fetch('/api/new', { method: 'POST' });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    busy = false;
    openGame(data.code, name);
  } catch (e) {
    busy = false; toast('Couldn’t start a game. Check your connection and try again.'); render();
  }
}
function joinGame(c) {
  const name = readName(); if (!name) return;
  c = (c || '').trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(c)) { toast('Game codes are 4 letters, like KQJT.'); return; }
  openGame(c, name);
}
async function shareLink() {
  const link = `${location.origin}/#${code}`;
  if (navigator.share) {
    try { await navigator.share({ title: 'Mormon Bridge', text: `Join my Mormon Bridge game. Code ${code}`, url: link }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(link); toast('Link copied. Paste it in your group text.'); }
  catch { toast(`Share this link: ${link}`); }
}

// ---------- rendering ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const nameOf = u => (view?.names?.[u]) || (view?.players?.find(p => p.id === u)?.name) || 'Player';
const online = u => !!view?.connected?.[u];

function cardHTML(c, o = {}) {
  const s = suitOf(c), red = s === 'H' || s === 'D';
  const cls = `card ${red ? 'red' : ''} ${o.sm ? 'sm' : ''} ${o.cls || ''}`;
  const label = `${rankLabel(rankOf(c))} of ${SUIT_NAME[s]}`;
  const inner = `<span class="ix">${rankLabel(rankOf(c))}</span><span class="pip">${SUIT_SYM[s]}</span>`;
  return o.button
    ? `<button class="${cls}" data-act="card" data-card="${c}" aria-label="${label}">${inner}</button>`
    : `<div class="${cls}" role="img" aria-label="${label}">${inner}</div>`;
}
const backHTML = (cls = 'sm') => `<div class="card back ${cls}" aria-hidden="true"></div>`;

function connBadge() {
  if (!code) return '';
  if (conn === 'open') return `<span class="chip" title="Connected"><span class="dot"></span>${esc(code)}</span>`;
  return `<span class="chip" title="Reconnecting"><span class="dot warn"></span>${esc(code)}</span>`;
}
function topBar() {
  return `<header class="top">
    <h1>Mormon Bridge</h1>
    <div class="row" style="gap:8px">
      ${connBadge()}
      <button class="btn ghost small" data-act="decks" aria-expanded="${showDecks}">Cards</button>
      ${code ? `<button class="btn ghost small" data-act="leave">Leave</button>` : ''}
    </div>
  </header>
  ${conn === 'retrying' ? `<p class="banner small">Lost the connection. Reconnecting…</p>` : ''}
  ${showDecks ? deckPicker() : ''}`;
}
function deckPicker() {
  return `<section class="panel stack" aria-label="Card style">
    <div class="row spread"><h2>Card style</h2><span class="small muted">Only changes your phone</span></div>
    <div class="decks">${DECKS.map(d => `
      <button class="deckopt ${d.id === deck ? 'on' : ''}" data-act="deck" data-deck="${d.id}" data-deck-preview="${d.id}">
        <div class="cards" data-deck="${d.id}">${cardHTML('S13', { sm: true })}${cardHTML('H7', { sm: true })}${backHTML()}</div>
        <span class="nm">${d.name}</span><span class="small muted">${d.desc}</span>
      </button>`).join('')}
    </div>
  </section>`;
}

function homeView() {
  const hashCode = (location.hash.match(/^#([A-Za-z]{4})$/) || [])[1] || '';
  return `${topBar()}
  <section class="panel stack">
    <div class="field"><label class="label" for="name">Your name</label>
      <input id="name" type="text" maxlength="16" autocomplete="nickname" placeholder="e.g. Grandma Jo" value="${esc(LS.get('name') || '')}"></div>
    ${hashCode ? `<button class="btn primary block" data-act="join" data-code="${esc(hashCode.toUpperCase())}">Join game ${esc(hashCode.toUpperCase())}</button>` :
      `<button class="btn primary block" data-act="create" ${busy ? 'disabled' : ''}>Start a new game</button>`}
    <div class="row" style="gap:8px">
      <input id="joincode" class="code" type="text" maxlength="4" placeholder="CODE" style="flex:1;min-width:0" autocapitalize="characters" autocomplete="off" value="${esc(hashCode.toUpperCase())}">
      <button class="btn" data-act="join">Join</button>
    </div>
  </section>
  <section class="panel stack">
    <h2>House rules</h2>
    <ul class="rules small">
      <li>Start with the biggest hand (7 cards by default), go down one card each round to 1, then back up.</li>
      <li>The card turned up after the deal is trump. If there's no card left over, there's no trump.</li>
      <li>Everyone bids at the same time, in secret. Bids show once the last one is in.</li>
      <li>Follow the suit that was led if you can. Highest trump wins, otherwise the highest card of the suit led. Aces are high.</li>
      <li>You can't lead trump until someone has played a trump that round, unless trump is all you have.</li>
      <li><b>Make your bid exactly:</b> 5 points plus 5 per trick you bid (bid 0 = 5, bid 1 = 10, bid 2 = 15). <b>Miss it:</b> −5.</li>
    </ul>
  </section>`;
}

function lobbyView() {
  const v = view, isHost = v.hostId === v.you;
  const hostAway = !online(v.hostId);
  const canHost = isHost || hostAway;
  const inGame = v.players.some(p => p.id === v.you);
  const n = Math.max(v.players.length, 1);
  const ms = v.settings.maxCards;
  const top = resolveMaxCards(ms, n);
  const opts = [`<option value="auto" ${ms === 'auto' ? 'selected' : ''}>Auto (${resolveMaxCards('auto', n)})</option>`]
    .concat(Array.from({ length: Math.floor(52 / n) }, (_, i) => i + 1)
      .map(x => `<option value="${x}" ${String(ms) === String(x) ? 'selected' : ''}>${x}</option>`)).join('');
  const roundCount = v.settings.backUp ? top * 2 - 1 : top;
  return `${topBar()}
  <section class="panel stack">
    <div class="row spread"><h2>Waiting for players</h2><span class="muted small">${v.players.length} at the table</span></div>
    <div class="row spread">
      <p class="small muted">Friends join with code <b style="color:var(--ink);letter-spacing:.12em">${esc(v.code)}</b>, or send them the link.</p>
      <button class="btn small" data-act="share">Invite</button>
    </div>
    <div class="players">
      ${v.players.map((p, i) => `<div class="prow" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="name"><span class="dot ${online(p.id) ? '' : 'off'}"></span>${esc(p.name)}
          ${p.id === v.hostId ? '<span class="tag">HOST</span>' : ''}${p.id === v.you ? '<span class="tag">YOU</span>' : ''}</span>
        ${canHost && p.id !== v.you ? `<button class="btn ghost small" data-act="kick" data-pid="${esc(p.id)}">Remove</button>` : `<span class="muted small">Seat ${i + 1}</span>`}
      </div>`).join('') || '<p class="muted small">Nobody here yet.</p>'}
    </div>
    ${!inGame ? `<button class="btn primary block" data-act="joincur">Sit down at this table</button>` : ''}
  </section>
  <section class="panel stack">
    <h2>Game settings</h2>
    ${canHost ? `
      <div class="field"><label class="label" for="maxcards">Biggest hand (first round)</label>
        <select id="maxcards" data-act="maxcards">${opts}</select></div>
      <label class="toggle"><input id="backup" type="checkbox" data-act="backup" ${v.settings.backUp ? 'checked' : ''}> Go back up after the 1-card round</label>
      <label class="toggle"><input id="dealerfix" type="checkbox" data-act="dealerfix" ${v.settings.dealerFix ? 'checked' : ''}> If bids add up to the tricks, the dealer changes theirs by one</label>
    ` : `<p class="small muted">First round: ${top} cards · ${v.settings.backUp ? 'down to 1 and back up' : 'down to 1'} · dealer rule ${v.settings.dealerFix ? 'on' : 'off'}</p>`}
    <p class="small muted">${roundCount} rounds: ${top} down to 1${v.settings.backUp && top > 1 ? ` and back up to ${top}` : ''}. Seats go in the order people joined.</p>
    ${canHost && inGame ? `<button class="btn primary block" data-act="start" ${v.players.length < 2 ? 'disabled' : ''}>Deal the first round</button>`
      : `<p class="banner small">The host deals when everyone's in.</p>`}
  </section>`;
}

function pendingMove(u) {
  const v = view;
  if (v.status === 'bidding') return !v.bidIn[u];
  if (v.status === 'dealerFix') return v.seats[v.dealer] === u;
  if (v.status === 'playing') return v.seats[v.turn] === u;
  return false;
}

function playersPanel() {
  const v = view, seated = v.seats.includes(v.you);
  return `<section class="players" aria-label="Players">
    ${v.seats.map((u, i) => {
      const isTurn = (v.status === 'playing' && v.turn === i) || (v.status === 'dealerFix' && v.dealer === i);
      let mid = '';
      if (v.status === 'bidding') {
        if (u === v.you && v.bids[u] != null) mid = `you bid <b>${v.bids[u]}</b>`;
        else mid = v.bidIn[u] ? '<span class="made">✓ bid in</span>' : 'thinking…';
      } else if (v.status === 'dealerFix') mid = `bid <b>${v.bids[u]}</b>`;
      else if (v.status === 'playing') mid = `<b>${v.tricksWon[u]}</b> of <b>${v.bids[u]}</b> <span class="count">${backHTML('tiny')}${v.handCounts[u]}</span>`;
      else if (v.history.length) {
        const r = v.history[v.history.length - 1].results[u];
        mid = `<span class="${r.pts > 0 ? 'made' : 'missed'}">${r.won}/${r.bid} · ${r.pts > 0 ? '+' : ''}${r.pts}</span>`;
      }
      const away = !online(u);
      const helper = away && seated && u !== v.you && pendingMove(u)
        ? `<button class="btn small" data-act="auto" data-pid="${esc(u)}">Play for them</button>` : '';
      return `<div class="prow ${isTurn ? 'turn' : ''}">
        <span class="name"><span class="dot ${away ? 'off' : ''}"></span>${esc(nameOf(u))}
          ${i === v.dealer && v.status !== 'gameOver' ? '<span class="tag dealer">DEALER</span>' : ''}${u === v.you ? '<span class="tag">YOU</span>' : ''}</span>
        <span class="mid">${helper || mid}</span>
        <span class="score">${v.scores[u]}</span>
      </div>`;
    }).join('')}
  </section>`;
}

function tableArea() {
  const v = view;
  let plays = v.trick, winner = null, note = '';
  if (!plays.length && v.lastTrick && ['playing', 'roundEnd', 'gameOver'].includes(v.status)) {
    plays = v.lastTrick.plays; winner = v.lastTrick.winner;
    note = `${esc(nameOf(winner))} took trick ${v.lastTrick.no}.`;
  }
  if (v.status === 'bidding') {
    const left = v.seats.filter(u => !v.bidIn[u]).length;
    note = left ? `Secret bids: waiting on ${left} ${left === 1 ? 'player' : 'players'}.` : '';
  } else if (v.status === 'dealerFix') {
    note = `The bids add up to ${v.rounds[v.roundIdx]}, the number of tricks. ${esc(nameOf(v.seats[v.dealer]))} has to change their bid by one.`;
  } else if (v.status === 'playing' && !plays.length) note = `${esc(nameOf(v.seats[v.turn]))} leads.`;
  return `<section class="panel table" aria-label="Table">
    ${plays.length ? `<div class="trick">${plays.map(p => `<div class="play ${p.p === winner ? 'win' : ''}">${cardHTML(p.c, { sm: true })}<span class="who">${esc(nameOf(p.p))}</span></div>`).join('')}</div>` : ''}
    ${note ? `<p class="note small muted">${note}</p>` : ''}
  </section>`;
}

function actionArea() {
  const v = view;
  const myIdx = v.seats.indexOf(v.you);
  if (myIdx < 0) return `<p class="banner small">You're watching this game. You can sit down for the next one.</p>`;
  const hand = sortHand(v.hand || [], v.trump);
  const cards = v.rounds[v.roundIdx];
  let top = '';
  if (v.status === 'bidding') {
    const mine = v.bids[v.you];
    top = `<div class="stack">
      <p>${mine == null ? '<b>Your bid.</b> How many tricks will you take?' : `<b>You bid ${mine}.</b> You can change it until the last bid is in.`}</p>
      <div class="bids">${Array.from({ length: cards + 1 }, (_, b) =>
        `<button class="btn ${b === mine ? 'primary' : ''}" data-act="bid" data-bid="${b}" aria-pressed="${b === mine}" aria-label="Bid ${b}">${b}</button>`).join('')}</div>
      <p class="small muted">Nobody sees anyone's bid until everyone has bid.</p></div>`;
  } else if (v.status === 'dealerFix') {
    if (v.dealer === myIdx) {
      const old = v.bids[v.you];
      const choices = [old - 1, old + 1].filter(b => b >= 0 && b <= cards);
      top = `<div class="stack"><p><b>Change your bid by one.</b> You bid ${old}.</p>
        <div class="row">${choices.map(b => `<button class="btn primary" data-act="fix" data-bid="${b}">Bid ${b}</button>`).join('')}</div></div>`;
    } else top = `<p class="muted">Waiting for ${esc(nameOf(v.seats[v.dealer]))} to change their bid.</p>`;
  } else if (v.status === 'playing') {
    if (v.turn === myIdx) top = `<div class="row spread"><p><b>Your turn.</b> ${selected ? 'Tap the card again or press Play.' : 'Pick a card.'}</p>
      ${selected ? `<button class="btn primary" data-act="playsel">Play ${rankLabel(rankOf(selected))}${SUIT_SYM[suitOf(selected)]}</button>` : ''}</div>`;
    else top = `<p class="muted">Waiting for ${esc(nameOf(v.seats[v.turn]))} to play.</p>`;
  }
  const legal = v.status === 'playing' && v.turn === myIdx ? legalCards(v.hand, v.trick, v.trump, v.trumpBroken) : null;
  const handHTML = hand.length ? `<div class="hand" aria-label="Your hand">${hand.map(c => {
    if (!legal) return cardHTML(c);
    return cardHTML(c, { button: true, cls: (legal.includes(c) ? '' : 'illegal') + (selected === c ? ' sel' : '') });
  }).join('')}</div>` : '';
  return `<section class="panel stack">${top}${handHTML}</section>`;
}

function roundEndArea() {
  const v = view;
  const last = v.history[v.history.length - 1];
  if (v.status === 'gameOver') {
    const best = Math.max(...v.seats.map(u => v.scores[u]));
    const winners = v.seats.filter(u => v.scores[u] === best).map(nameOf);
    const canHost = v.hostId === v.you || !online(v.hostId);
    return `<section class="panel stack">
      <h2>${winners.map(esc).join(' & ')} ${winners.length > 1 ? 'tie' : 'wins'} with ${best} points</h2>
      <p class="small muted">That was the last round.</p>
      ${canHost ? `<button class="btn primary block" data-act="end">Play again with this table</button>` : `<p class="small muted">The host can start a new game.</p>`}
    </section>`;
  }
  const seated = v.seats.includes(v.you);
  return `<section class="panel stack">
    <h2>Round ${v.roundIdx + 1} is done</h2>
    <p class="small muted">${v.seats.map(u => { const r = last.results[u]; return `${esc(nameOf(u))} ${r.pts > 0 ? 'made it' : 'missed'} (${r.pts > 0 ? '+' : ''}${r.pts})`; }).join(' · ')}</p>
    ${seated ? `<button class="btn primary block" data-act="next">Deal round ${v.roundIdx + 2} (${v.rounds[v.roundIdx + 1]} card${v.rounds[v.roundIdx + 1] > 1 ? 's' : ''})</button>` : ''}
  </section>`;
}

function historyArea() {
  const v = view;
  if (!v.history.length) return '';
  return `<details class="panel" ${v.status === 'gameOver' ? 'open' : ''}>
    <summary>Score sheet</summary>
    <div class="tablewrap"><table class="hist">
      <thead><tr><th>Cards</th>${v.seats.map(u => `<th>${esc(nameOf(u))}</th>`).join('')}</tr></thead>
      <tbody>${v.history.map(h => `<tr><td>${h.cards} ${h.trump ? SUIT_SYM[h.trump] : '–'}</td>${v.seats.map(u => {
        const r = h.results[u]; return `<td class="${r.pts > 0 ? 'made' : 'missed'}">${r.won}/${r.bid} ${r.pts > 0 ? '+' : ''}${r.pts}</td>`; }).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td>${v.seats.map(u => `<td>${v.scores[u]}</td>`).join('')}</tr></tfoot>
    </table></div>
  </details>`;
}

function hostTools() {
  const v = view;
  if (v.status === 'gameOver') return '';
  const canHost = v.hostId === v.you || !online(v.hostId);
  if (!canHost) return '';
  if (confirming === 'end') return `<section class="panel stack confirm">
    <p>End this game for everyone and go back to the table? Scores will be cleared.</p>
    <div class="row"><button class="btn primary" data-act="end">End game</button><button class="btn" data-act="cancel">Keep playing</button></div>
  </section>`;
  return `<div class="row" style="justify-content:center"><button class="btn ghost small" data-act="askend">End game early</button></div>`;
}

function gameView() {
  const v = view, cards = v.rounds[v.roundIdx];
  return `${topBar()}
  <section class="status">
    <div><div class="label">Round ${v.roundIdx + 1} of ${v.rounds.length}</div>
      <div class="big">${cards} card${cards > 1 ? 's' : ''} each</div></div>
    <div class="trumpbox">
      <div style="text-align:right"><div class="label">Trump</div><div class="small">${v.trump ? SUIT_NAME[v.trump] : 'No trump'}</div></div>
      ${v.trumpCard ? cardHTML(v.trumpCard, { sm: true }) : backHTML()}
    </div>
  </section>
  ${playersPanel()}
  ${v.status === 'roundEnd' || v.status === 'gameOver' ? roundEndArea() : ''}
  ${tableArea()}
  ${['bidding', 'dealerFix', 'playing'].includes(v.status) ? actionArea() : ''}
  ${historyArea()}
  ${hostTools()}`;
}

function render() {
  const focusId = document.activeElement?.id;
  const keep = {};
  ['name', 'joincode'].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
  let html;
  if (!code) html = homeView();
  else if (!view) html = `${topBar()}<section class="panel"><p class="muted">${conn === 'retrying' ? 'Can’t reach the game yet. It will load as soon as your phone reconnects.' : 'Finding the table…'}</p></section>`;
  else if (view.status === 'lobby') html = lobbyView();
  else html = gameView();
  $app.innerHTML = html;
  Object.entries(keep).forEach(([id, val]) => { const el = document.getElementById(id); if (el && val) el.value = val; });
  if (focusId) document.getElementById(focusId)?.focus();
}

// ---------- input ----------
$app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'create') createGame();
  else if (a === 'join') joinGame(t.dataset.code || document.getElementById('joincode').value);
  else if (a === 'joincur') { const n = (LS.get('name') || '').trim(); if (n) send({ type: 'join', name: n }); else { leaveGame(); toast('Type your name, then join with the code.'); } }
  else if (a === 'leave') { if (view?.status === 'lobby' && view.players.some(p => p.id === view.you)) send({ type: 'leave' }); leaveGame(); }
  else if (a === 'share') shareLink();
  else if (a === 'decks') { showDecks = !showDecks; render(); }
  else if (a === 'deck') { deck = t.dataset.deck; LS.set('deck', deck); document.body.dataset.deck = deck; showDecks = false; render(); }
  else if (a === 'start') send({ type: 'start' });
  else if (a === 'kick') send({ type: 'kick', pid: t.dataset.pid });
  else if (a === 'bid') send({ type: 'bid', bid: parseInt(t.dataset.bid, 10) });
  else if (a === 'fix') send({ type: 'fix', bid: parseInt(t.dataset.bid, 10) });
  else if (a === 'card') {
    if (t.classList.contains('illegal')) {
      toast(view.trick.length ? 'You have to follow the suit that was led.' : 'Nobody has played a trump yet, so you can’t lead one.');
      return;
    }
    const c = t.dataset.card;
    if (selected === c) { send({ type: 'play', card: c }); } else { selected = c; render(); }
  }
  else if (a === 'playsel' && selected) send({ type: 'play', card: selected });
  else if (a === 'next') send({ type: 'next' });
  else if (a === 'auto') send({ type: 'auto', pid: t.dataset.pid });
  else if (a === 'askend') { confirming = 'end'; render(); }
  else if (a === 'cancel') { confirming = null; render(); }
  else if (a === 'end') { confirming = null; send({ type: 'end' }); }
});
$app.addEventListener('change', e => {
  const t = e.target, a = t.dataset.act;
  if (a === 'maxcards') send({ type: 'settings', patch: { maxCards: t.value === 'auto' ? 'auto' : parseInt(t.value, 10) } });
  else if (a === 'backup') send({ type: 'settings', patch: { backUp: t.checked } });
  else if (a === 'dealerfix') send({ type: 'settings', patch: { dealerFix: t.checked } });
});
$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'joincode') joinGame(e.target.value);
});
// Phones drop sockets when the screen locks; reconnect right away when it comes back.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && code && (!ws || ws.readyState > 1)) { retry = 0; connect(); }
});

// Opened from an invite link for a different game than the one remembered: show the join screen.
const linkCode = (location.hash.match(/^#([A-Za-z]{4})$/) || [])[1];
if (linkCode && linkCode.toUpperCase() !== code) { code = null; LS.set('code', null); }
if (code) connect(); else render();
</script>
</body>
</html>
